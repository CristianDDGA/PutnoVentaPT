<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Punto de Venta - Gestión de ventas, clientes y productos" />
    <title>Punto de Venta</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- App styles -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PuntoVenta.Blazor.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <script>
        window.pvAuthStorage = {
            get: (key) => localStorage.getItem(key),
            set: (key, value) => localStorage.setItem(key, value),
            remove: (key) => localStorage.removeItem(key)
        };

        // Download PDF from a base-64 string
        window.downloadPdf = (base64, fileName) => {
            const bytes    = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
            const blob     = new Blob([bytes], { type: 'application/pdf' });
            const url      = URL.createObjectURL(blob);
            const link     = document.createElement('a');
            link.href      = url;
            link.download  = fileName;
            link.click();
            URL.revokeObjectURL(url);
        };

        // Show a native confirmation dialog and return the boolean result
        window.confirmDialog = (message) => confirm(message);

        // Keyboard navigation and Audio Synth Cues
        window.pvKeyboardBridge = {
            dotNetHelper: null,
            register: function (helper) {
                this.dotNetHelper = helper;
            },
            triggerSound: function (type) {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    if (type === 'success') {
                        osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 (High beep)
                        gain.gain.setValueAtTime(0.04, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.12);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.12);
                    } else if (type === 'error') {
                        osc.frequency.setValueAtTime(220, ctx.currentTime); // A3 (Low buzzer)
                        gain.gain.setValueAtTime(0.08, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.25);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.25);
                    } else if (type === 'click') {
                        osc.frequency.setValueAtTime(550, ctx.currentTime); // Medium tap
                        gain.gain.setValueAtTime(0.015, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.06);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.06);
                    }
                } catch (e) {
                    console.log('Web Audio Context not loaded/permitted:', e);
                }
            },
            focusElement: function (id) {
                setTimeout(() => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.focus();
                        if (el.select) el.select();
                    }
                }, 40);
            }
        };

        window.addEventListener('keydown', (e) => {
            if (!window.pvKeyboardBridge.dotNetHelper) return;

            // Alt + Numbers for page navigation
            if (e.altKey && e.key >= '1' && e.key <= '7') {
                e.preventDefault();
                window.pvKeyboardBridge.dotNetHelper.invokeMethodAsync('OnGlobalPageShortcut', parseInt(e.key));
                window.pvKeyboardBridge.triggerSound('click');
                return;
            }

            const activeModal = document.querySelector('.modal-overlay');

            const handledKeys = ['F2', 'F4', 'F6', 'F8', 'F9', 'Escape'];
            const modalNavKeys = ['ArrowUp', 'ArrowDown', 'Enter'];

            if (handledKeys.includes(e.key)) {
                e.preventDefault();
                window.pvKeyboardBridge.dotNetHelper.invokeMethodAsync('OnGlobalShortcut', e.key);
                window.pvKeyboardBridge.triggerSound('click');
                return;
            }

            if (activeModal && modalNavKeys.includes(e.key)) {
                if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName === 'INPUT') {
                    return;
                }
                e.preventDefault();
                window.pvKeyboardBridge.dotNetHelper.invokeMethodAsync('OnGlobalShortcut', e.key);
                window.pvKeyboardBridge.triggerSound('click');
            }
        });
    </script>

    <div id="app">
        <div class="app-loader">
            <div class="loader-ring"></div>
            <p class="loader-text">Cargando sistema...</p>
        </div>
    </div>


    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
